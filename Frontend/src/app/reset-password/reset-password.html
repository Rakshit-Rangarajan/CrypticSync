<div class="login-container">
  <div class="login-card">
    <div class="login-left">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="company-name">CrypticSync</h1>
      </div>
      <div class="login-illustration">
        <div class="floating-element el-1"></div>
        <div class="floating-element el-2"></div>
        <div class="floating-element el-3"></div>
      </div>
    </div>
    <div class="login-right">
      <div class="form-header">
        <div class="mobile-logo">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h1 class="company-name">CrypticSync</h1>
        </div>
        <p class="subtitle">Set your new password</p>
      </div>

      <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="login-form">
        <div class="input-group">
          <label for="newPassword">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            New Password
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="newPassword" 
              name="newPassword" 
              [(ngModel)]="newPassword" 
              placeholder="Enter new password (min 8 chars)"
              required
              minlength="8"
            >
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Confirm Password
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              [(ngModel)]="confirmPassword" 
              placeholder="Confirm your new password"
              required
            >
          </div>
        </div>

        @if (error()) {
          <div class="error-message">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ error() }}
          </div>
        }

        @if (successMessage()) {
          <div class="success-message" style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid rgba(16, 185, 129, 0.2);">
            {{ successMessage() }}
          </div>
        }

        <button type="submit" class="login-button" [disabled]="isLoading() || !token">
          @if (!isLoading()) {
            <span>Update Password</span>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14"></path>
              <path d="M12 5l7 7-7 7"></path>
            </svg>
          } @else {
            <div class="spinner"></div>
          }
        </button>

        <div class="form-footer">
          <a href="/login" class="forgot-link">← Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
