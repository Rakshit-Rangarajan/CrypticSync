<div class="app-layout" [class.authenticated]="authService.isAuthenticated()">
  @if (authService.isAuthenticated()) {
    <app-navbar />
    <main class="main-content">
      <router-outlet />
    </main>
    <app-footer />
  } @else {
    <div class="auth-container">
      <router-outlet />
    </div>
  }
</div>
