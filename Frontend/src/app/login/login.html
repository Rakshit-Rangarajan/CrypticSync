<div class="login-wrapper">
  <div class="login-container">
    <div class="login-bg">
      <div class="bg-gradient"></div>
      <div class="bg-grid"></div>
    </div>
    
    <div class="login-card">
      <div class="login-header">
        <div class="logo-container">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <h1 class="company-name">CrypticSync</h1>
        </div>
        <p class="subtitle">Secure Employee Attendance Management</p>
      </div>

      @if (!isForgotPasswordView()) {
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
          <div class="input-group">
            <label for="username">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              Email or Employee ID
            </label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="username" 
                name="username" 
                [(ngModel)]="username" 
                placeholder="Enter your email or employee ID"
                required
                autocomplete="username"
              >
            </div>
          </div>

          <div class="input-group">
            <label for="password">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              Password
            </label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                [(ngModel)]="password" 
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              >
            </div>
          </div>

          @if (error()) {
            <div class="error-message">
              <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              {{ error() }}
            </div>
          }

          <button type="submit" class="login-button" [disabled]="isLoading()">
            @if (!isLoading()) {
              <span>Sign In</span>
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            } @else {
              <div class="spinner"></div>
            }
          </button>

          <div class="demo-logins">
            <p class="demo-title">Quick Demo Logins</p>
            <div class="demo-buttons">
              <button type="button" class="btn-demo" (click)="fillDemo('superadmin')">Super Admin</button>
              <button type="button" class="btn-demo" (click)="fillDemo('admin')">Admin</button>
              <button type="button" class="btn-demo" (click)="fillDemo('manager')">Manager</button>
              <button type="button" class="btn-demo" (click)="fillDemo('team_lead')">Team Lead</button>
              <button type="button" class="btn-demo" (click)="fillDemo('employee')">Employee</button>
            </div>
          </div>

          <div class="form-footer">
            <a href="#" (click)="toggleForgotPassword(); $event.preventDefault()" class="forgot-link">Forgot Password?</a>
            <span class="divider">•</span>
            <a href="#" class="request-link">Request Access</a>
          </div>
        </form>
      } @else {
        <form (ngSubmit)="requestPasswordReset()" #forgotForm="ngForm" class="login-form">
          <div class="input-group">
            <label for="forgotEmail">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              Email Address
            </label>
            <div class="input-wrapper">
              <input 
                type="email" 
                id="forgotEmail" 
                name="forgotEmail" 
                [(ngModel)]="forgotEmail" 
                placeholder="Enter your registered email"
                required
              >
            </div>
          </div>

          @if (error()) {
            <div class="error-message">
              {{ error() }}
            </div>
          }
          @if (forgotMessage()) {
            <div class="success-message" style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid rgba(16, 185, 129, 0.2);">
              {{ forgotMessage() }}
            </div>
          }

          <button type="submit" class="login-button" [disabled]="isLoading()">
            @if (!isLoading()) {
              <span>Send Reset Link</span>
            } @else {
              <div class="spinner"></div>
            }
          </button>

          <div class="form-footer">
            <a href="#" (click)="toggleForgotPassword(); $event.preventDefault()" class="forgot-link">← Back to Login</a>
          </div>
        </form>
      }
    </div>
  </div>
</div>
