<nav class="navbar" *ngIf="authService.isAuthenticated()">
  <div class="nav-left">
    <a routerLink="/dashboard" class="brand">
      <div class="brand-icon">CS</div>
      <span class="brand-text">CrypticSync</span>
    </a>
    
    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        Dashboard
      </a>
      <a routerLink="/leave" routerLinkActive="active" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Leave
      </a>
      <a routerLink="/reports" routerLinkActive="active" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        Reports
      </a>
      <a routerLink="/contact-hr" routerLinkActive="active" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Contact HR
      </a>
    </div>
  </div>

  <div class="nav-right">
    <button class="icon-btn" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-dot"></span>
    </button>
    
    <a routerLink="/settings" class="user-menu">
      <div class="user-avatar">{{ getInitials() }}</div>
      <div class="user-details">
        <span class="user-name">{{ authService.currentUser()?.name }}</span>
        <span class="user-role">{{ authService.currentUser()?.role }}</span>
      </div>
    </a>
    
    <button class="logout-btn" (click)="logout()" title="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</nav>
